name: Site validation

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
        env:
          POST_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  publishing-pr-contract:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'publisher/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: post-source
          persist-credentials: false
      # Share the exact reviewed Publisher validator; keep it outside the
      # candidate post tree and pin upgrades alongside the ledger workflow.
      - uses: actions/checkout@v4
        with:
          repository: SuperDudePro/Blog-Site
          ref: 4692ed7bb6920e189fbc93ef7a1248ef622c0691
          path: publisher-contract
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest, source and approved image-byte digests
        working-directory: post-source
        run: node ../publisher-contract/scripts/validate-publishing-pr.mjs

  publishing-contract-regression:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'publisher/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: post-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SuperDudePro/Blog-Site
          ref: 4692ed7bb6920e189fbc93ef7a1248ef622c0691
          path: publisher-contract
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test shared CLI against LifeEducation fixtures
        working-directory: post-source
        run: node scripts/test-publishing-pr-contract.mjs ../publisher-contract
