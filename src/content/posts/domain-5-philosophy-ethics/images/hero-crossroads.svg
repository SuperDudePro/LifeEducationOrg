  <text x="800" y="820" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="58" fill="#1d1d1b">ETHICS STARTS WHEN THE EASY ANSWER RUNS OUT.</text>
  <text x="800" y="866" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#4f842b">Domain 5: Philosophy &amp; Ethics</text>
