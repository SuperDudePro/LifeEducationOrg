    <path d="M120 595 C300 480 500 415 695 390" fill="none" stroke="#1c1c1a" stroke-width="4" stroke-opacity="0.24"/>
    <path d="M1480 595 C1300 480 1100 415 905 390" fill="none" stroke="#1c1c1a" stroke-width="4" stroke-opacity="0.24"/>
  </g>
  <g transform="translate(728 292)">
    <path d="M72 40 C118 40 143 82 137 128 C132 170 112 199 111 245 L37 245 C37 203 15 171 8 130 C0 82 27 40 72 40 Z" fill="#22221f"/>
