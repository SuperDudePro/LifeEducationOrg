  <path d="M1600 735 C1380 655 1140 615 895 600 C995 685 1085 785 1155 900 L1600 900 Z" fill="url(#hatch)" opacity="0.8"/>
  <path d="M760 900 C745 770 748 675 792 594" stroke="#22221f" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.72"/>
  <path d="M840 900 C855 770 852 675 808 594" stroke="#22221f" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.72"/>
  <path d="M807 602 C790 700 765 790 735 900" stroke="#5a8f2f" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.92"/>
  <path d="M793 602 C810 700 835 790 865 900" stroke="#5a8f2f" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.92"/>
