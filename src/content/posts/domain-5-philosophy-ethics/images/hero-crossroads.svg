<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A young person at a difficult ethical crossroads</title>
  <desc id="desc">Charcoal-style illustration of a young person facing split paths marked by easy opinion, popular choice, consequence, courage, and character, with restrained green highlights.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#e7e0d2"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="52%" r="48%">
      <stop offset="0" stop-color="#7aa33a" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#7aa33a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7aa33a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 6 H12" stroke="#1d1d1b" stroke-opacity="0.16" stroke-width="2"/>
    </pattern>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="12"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
  </defs>
